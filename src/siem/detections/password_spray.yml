id: password-spray
title: Password spraying (many accounts, one source)
type: threshold
severity: high
mitre: [T1110.003]
description: >
  One source IP failing logons against many different accounts. Sprayers try
  one or two common passwords per account to stay under lockout limits, so a
  per-account brute-force rule misses them.
filter:
  action: logon
  outcome: failure
group_by: [src_ip]
distinct: user
threshold: 5
window: 10m
