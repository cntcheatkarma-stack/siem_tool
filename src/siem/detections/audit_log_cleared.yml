id: audit-log-cleared
title: Windows Security log cleared
type: match
severity: critical
mitre: [T1070.001]
description: >
  Event 1102: the Security audit log was cleared. This is rarely legitimate
  and is classic anti-forensics. Preserve whatever logs remain (forwarded
  copies, other hosts) and find out who did it.
filter:
  event_id: 1102
